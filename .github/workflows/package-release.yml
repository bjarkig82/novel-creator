name: Package release

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [candidate, publish]
        required: true
      windows_suite:
        description: Windows candidate coverage (auto selects conservatively from cumulative changes)
        type: choice
        options: [auto, full]
        default: auto
      candidate_run:
        description: Successful candidate run ID (publish only)
        type: string
      candidate_attempt:
        description: Candidate run attempt (publish only)
        type: string
      artifact_id:
        description: Immutable candidate artifact ID (publish only)
        type: string
      source_commit:
        description: Full candidate source SHA (publish only)
        type: string
      host_evidence:
        description: Candidate-bound automated-only qualification JSON; windows_host and linux_host must be false
        type: string

permissions:
  contents: read

# Match the documented UTF-8 environment, including child Python processes.
env:
  PYTHONUTF8: "1"

concurrency:
  group: package-release-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  candidate:
    if: inputs.mode == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build --outdir candidate
      - run: python -m twine check candidate/*
      - name: Select Windows qualification and create manifest
        env:
          WINDOWS_SUITE: ${{ inputs.windows_suite }}
        run: |
          if [ "$WINDOWS_SUITE" = full ]; then
            python tests/package_release.py manifest candidate --full
          else
            python tests/package_release.py manifest candidate
          fi
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30

  candidate-checks:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Hang protection only: the real Windows crash/recovery matrix exceeds 45m.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: candidate
      - name: Verify candidate manifest
        id: qualification
        run: python tests/package_release.py verify candidate
      - run: python -m pip install -e '.[test]'
      - name: Check project skill upgrades
        run: python -m unittest tests.integration.test_notebook_update tests.contract.test_legacy_focused_methods -q
      - name: Verify plugin runtime installation
        run: python tests/verify_plugin_install.py --wheel candidate/*.whl --report plugin-runtime-check.json
      - name: Verify previous published notebook compatibility
        run: python tests/verify_marketplace_previous.py --wheel candidate/*.whl --report plugin-previous-check.json
      - name: Run full unit suite
        if: runner.os == 'Linux' || steps.qualification.outputs.windows_suite == 'full'
        run: python -m unittest discover -q
      - name: Run Windows compatibility suite
        if: runner.os == 'Windows' && steps.qualification.outputs.windows_suite == 'compatibility'
        run: python -m tests.release_checks --run
      - name: Verify wheel bytes and legacy journeys
        run: python tests/verify_wheel.py candidate/*.whl
      - name: Verify clean wheel installation
        run: python tests/verify_package_install.py --wheel candidate/*.whl > candidate-check.json
      - name: Verify clean installation from the candidate sdist
        run: python tests/verify_package_install.py --wheel candidate/*.tar.gz > candidate-sdist-check.json
      - name: Follow the literal Bash getting-started guide
        if: runner.os == 'Linux'
        run: bash tests/package_init_release_guide.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/candidate" "$(command -v python)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-check-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate-check.json
            plugin-runtime-check.json
            plugin-previous-check.json
          if-no-files-found: error

  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
      CANDIDATE_ARTIFACT: ${{ inputs.artifact_id }}
      CANDIDATE_COMMIT: ${{ inputs.source_commit }}
      HOST_EVIDENCE: ${{ inputs.host_evidence }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate
      - run: python tests/package_release.py verify-remote candidate
      - name: Stage only verified distribution files
        run: |
          python -c "import json,pathlib,shutil; root=pathlib.Path('candidate'); out=pathlib.Path('publish'); out.mkdir(); data=json.loads((root/'manifest.json').read_text()); [shutil.copyfile(root/name,out/name) for name in data['files']]"
      - uses: pypa/gh-action-pypi-publish@2442bad8f54b06a326f3030ef5e6a7a674118557
        with:
          packages-dir: publish/

  public-checks:
    if: inputs.mode == 'publish'
    needs: publish
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Check named production install and selected archive hash
        run: |
          package=$(python -c "import json; d=json.load(open('candidate/manifest.json')); print(d['distribution']+'=='+d['version'])")
          python tests/verify_package_install.py --package "$package" --manifest candidate/manifest.json > public-check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-check-${{ matrix.os }}-${{ github.run_id }}
          path: public-check.json
          if-no-files-found: error
