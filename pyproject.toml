[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-creator"
dynamic = ["version"]
description = "Independent novel projects and saved Codex writing workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "jsonschema-rs>=0.59,<0.60", "packaging>=24"]

[project.urls]
Source = "https://github.com/bjarkig82/novel-creator"
Documentation = "https://github.com/bjarkig82/novel-creator/blob/main/workflows/start-here.md"

[project.optional-dependencies]
test = ["setuptools>=77"]

[project.scripts]
novel-creator = "novel_creator.cli:main"

[tool.setuptools]
packages = ["novel_creator", "novel_creator.schemas", "novel_creator.schemas.v1", "novel_creator.workflows", "novel_creator.languages", "novel_creator.codex", "novel_creator.claude", "novel_creator.notebook_resources"]
package-dir = {"novel_creator" = "src/novel_creator", "novel_creator.schemas" = "schemas", "novel_creator.workflows" = "workflows", "novel_creator.languages" = "languages", "novel_creator.codex" = "adapters/codex", "novel_creator.claude" = "adapters/claude", "novel_creator.notebook_resources" = "notebook"}

[tool.setuptools.package-data]
"novel_creator" = ["update-release.json"]
"novel_creator.schemas.v1" = ["*.json"]
"novel_creator.workflows" = ["*.md"]
"novel_creator.languages" = ["*.md"]
"novel_creator.codex" = ["*.md", "skills/*/SKILL.md", "notebook/*.md", "notebook/agents/*.toml", "notebook/skills/*/SKILL.md"]
"novel_creator.claude" = ["notebook/*.md"]
"novel_creator.notebook_resources" = ["workflows/*.md", "languages/*.md", "templates/*.md"]

[tool.setuptools.dynamic]
version = {attr = "novel_creator.__version__"}
