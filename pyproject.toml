[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-creator"
version = "0.1.0"
description = "Local, Git-backed story exchange persistence"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "jsonschema-rs>=0.59,<0.60"]

[project.optional-dependencies]
test = []

[project.scripts]
novel-creator = "novel_creator.cli:main"

[tool.setuptools]
packages = ["novel_creator", "novel_creator.schemas", "novel_creator.schemas.v1", "novel_creator.workflows", "novel_creator.languages", "novel_creator.codex"]
package-dir = {"novel_creator" = "src/novel_creator", "novel_creator.schemas" = "schemas", "novel_creator.workflows" = "workflows", "novel_creator.languages" = "languages", "novel_creator.codex" = "adapters/codex"}

[tool.setuptools.package-data]
"novel_creator.schemas.v1" = ["*.json"]
"novel_creator.workflows" = ["*.md"]
"novel_creator.languages" = ["*.md"]
"novel_creator.codex" = ["*.md", "skills/*/SKILL.md"]
